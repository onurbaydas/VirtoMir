<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/VirtoMir/demo/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>VirtoMir</title>
    <script>
      // Online demo only (npm run build:demo): GitHub Pages' 404 page sends deep links on as
      // <base>/?p=/machines/x#tab; put the path back before the router reads it.
      if ('1' === '1') {
        const p = new URLSearchParams(location.search).get('p')
        if (p && p.startsWith('/')) history.replaceState(null, '', '/VirtoMir/demo/'.replace(/\/$/, '') + p + location.hash)
      }
    </script>
    <script>
      // Apply the saved theme before first paint (no flash).
      try {
        const t = localStorage.getItem('virtomir.theme') ?? 'system'
        const dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      } catch {
        document.documentElement.dataset.theme = 'dark'
      }
    </script>
    <script type="module" crossorigin src="/VirtoMir/demo/assets/index-Db-f6Rpn.js"></script>
    <link rel="modulepreload" crossorigin href="/VirtoMir/demo/assets/i18n.svelte-B5lOmjER.js">

    <link rel="stylesheet" crossorigin href="/VirtoMir/demo/assets/index-BUlYG9Sc.css">
  </head>
