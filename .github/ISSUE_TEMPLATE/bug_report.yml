name: Bug report
description: Something does not work as it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Security problem?** Please do not open a public issue; see the security policy
        (repository → Security → Report a vulnerability).
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Click …
        3. See …
    validations:
      required: true
  - type: input
    id: virtomir
    attributes:
      label: VirtoMir version
      description: "Account → Updates, or `dpkg -s virtomir` / `rpm -q virtomir`"
    validations:
      required: true
  - type: input
    id: distro
    attributes:
      label: Host distribution and version
      placeholder: "Debian 13, Ubuntu 24.04, Fedora 42, …"
    validations:
      required: true
  - type: input
    id: libvirt
    attributes:
      label: libvirt and QEMU versions
      description: "`virsh version`"
      placeholder: "libvirt 12.0.0, QEMU 10.1.0"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Installed from
      options:
        - apt / dnf repository
        - .deb or .rpm file
        - Release tarball (install.sh)
        - Built from source
    validations:
      required: true
  - type: dropdown
    id: scale
    attributes:
      label: Hosts
      options:
        - One host
        - A cluster (say how many below)
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser (for UI problems)
      placeholder: "Firefox 144, Chrome 141 on Android, …"
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: "`journalctl -u virtomird --since -1h` around the problem, and the browser console if the UI misbehaves. Remove anything private."
      render: text
