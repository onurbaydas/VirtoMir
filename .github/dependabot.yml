# Weekly dependency updates, grouped so each ecosystem opens at most one pull request a week.
version: 2
updates:
  - package-ecosystem: gomod
    directories:
      - "/"
      - "/integrations/terraform-provider-virtomir"
      - "/integrations/packer-plugin-virtomir"
      - "/integrations/virtomir-operator"
      - "/integrations/virtomir-csi"
    schedule:
      interval: weekly
    groups:
      go:
        patterns: ["*"]
    open-pull-requests-limit: 3
  - package-ecosystem: npm
    directory: "/web"
    schedule:
      interval: weekly
    ignore:
      # svelte-check supports TypeScript 5 and 6 only; a new major waits until it does.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      npm:
        patterns: ["*"]
    open-pull-requests-limit: 3
  - package-ecosystem: npm
    directory: "/sdk/typescript"
    schedule:
      interval: weekly
    groups:
      sdk-npm:
        patterns: ["*"]
  - package-ecosystem: maven
    directory: "/sdk/java"
    schedule:
      interval: weekly
    groups:
      sdk-maven:
        patterns: ["*"]
  - package-ecosystem: nuget
    directory: "/sdk/dotnet"
    schedule:
      interval: weekly
    groups:
      sdk-nuget:
        patterns: ["*"]
  - package-ecosystem: docker
    directories:
      - "/integrations/virtomir-csi"
      - "/integrations/virtomir-operator"
    schedule:
      interval: weekly
    groups:
      docker:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    ignore:
      # The v2.6.0 image cannot be pulled from ghcr.io (its amd64 manifest is missing).
      - dependency-name: ossf/scorecard-action
        versions: ["2.6.0"]
    groups:
      actions:
        patterns: ["*"]
