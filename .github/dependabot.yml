# Weekly dependency updates, grouped so each ecosystem opens at most one pull request a week.
version: 2
updates:
  - package-ecosystem: gomod
    directories:
      - "/"
      - "/integrations/terraform-provider-virtomir"
      - "/integrations/packer-plugin-virtomir"
      - "/integrations/virtomir-operator"
      - "/integrations/virtomir-csi"
    schedule:
      interval: weekly
    groups:
      go:
        patterns: ["*"]
    open-pull-requests-limit: 3
  - package-ecosystem: npm
    directory: "/web"
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
    open-pull-requests-limit: 3
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
