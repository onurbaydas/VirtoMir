# Weekly dependency updates, grouped so each ecosystem opens at most one pull request a week.
version: 2
updates:
  - package-ecosystem: gomod
    directories:
      - "/"
      - "/integrations/terraform-provider-virtomir"
      - "/integrations/packer-plugin-virtomir"
      - "/integrations/virtomir-operator"
      - "/integrations/virtomir-csi"
    schedule:
      interval: weekly
    groups:
      go:
        patterns: ["*"]
    open-pull-requests-limit: 3
  - package-ecosystem: npm
    directory: "/web"
    schedule:
      interval: weekly
    ignore:
      # svelte-check supports TypeScript 5 and 6 only; a new major waits until it does.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      npm:
        patterns: ["*"]
    open-pull-requests-limit: 3
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
