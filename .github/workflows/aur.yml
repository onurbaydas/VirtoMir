name: AUR

# Publishes packaging/aur (virtomir-bin) to the Arch User Repository for a stable release.
# The release workflow calls this after the tarballs are published; run it by hand
# (Actions → AUR → Run workflow) to publish a tag again. The version comes from the tag, so
# PKGBUILD and .SRCINFO need no edit per release.
# Needs the secret AUR_SSH_KEY: a private SSH key whose public half is on the maintainer's
# AUR account (My Account → SSH Public Key).
on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, e.g. v1.2.0
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: aur
  cancel-in-progress: false

jobs:
  aur:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}

      - name: SSH key for the AUR
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$AUR_SSH_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          # The AUR's host key, pinned (https://aur.archlinux.org: SSH fingerprints).
          echo 'aur.archlinux.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEuBKrPzbawxA/k2g6NcyV5jmqwJ2s+zpgZGZ7tpLIcN' > ~/.ssh/known_hosts
          printf 'Host aur.archlinux.org\n  User aur\n  IdentityFile ~/.ssh/aur\n  IdentitiesOnly yes\n' > ~/.ssh/config

      - name: Set the version from the tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          new="${TAG#v}"
          case "$new" in *-*|"") echo "not a stable tag: $TAG"; exit 1 ;; esac
          old=$(sed -n 's/^pkgver=//p' packaging/aur/PKGBUILD)
          sed -i "s/^pkgver=.*/pkgver=$new/; s/^pkgrel=.*/pkgrel=1/" packaging/aur/PKGBUILD
          sed -i "s/$old/$new/g; s/pkgrel = .*/pkgrel = 1/" packaging/aur/.SRCINFO
          grep -q "pkgver = $new" packaging/aur/.SRCINFO

      - name: Push to the AUR
        env:
          TAG: ${{ inputs.tag }}
        run: |
          git clone ssh://aur@aur.archlinux.org/virtomir-bin.git aur
          cp packaging/aur/PKGBUILD packaging/aur/.SRCINFO aur/
          cd aur
          git config user.name "Onur Baydas"
          git config user.email "onurbaydas@users.noreply.github.com"
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then
            echo "The AUR already has ${TAG}."
            exit 0
          fi
          git commit -q -m "Update to ${TAG#v}"
          git push origin HEAD:master
