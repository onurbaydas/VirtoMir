name: Attribution

# AGENTS.md, rule zero: no AI tool or vendor named in commits. Fails a push or pull request that adds one.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: No AI attribution in new commits
        env:
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          from="${BASE:-$BEFORE}"
          if [ -z "$from" ] || ! git cat-file -e "$from^{commit}" 2>/dev/null; then
            range="$HEAD~1..$HEAD"
          else
            range="$from..$HEAD"
          fi
          bad=$(git log "$range" --format='%h %an <%ae> / %cn <%ce>%n%B' \
            | grep -iE 'claude|anthropic' || true)
          if [ -n "$bad" ]; then
            echo "::error::AI attribution in commits ($range), see AGENTS.md rule zero:"
            echo "$bad"
            exit 1
          fi
          echo "clean: $range"
