name: Release

# Push a tag like v0.1.0 to build and publish a release: a tarball and a .deb for amd64 and
# arm64 (each built natively, PAM needs cgo), plus an experimental .rpm for each.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libpam0g-dev rpm

      - name: Test
        run: go test ./...

      - name: Tarball with PAM
        run: sh scripts/build-release.sh "${GITHUB_REF_NAME}"

      - name: Debian package
        run: SKIP_WEB=1 sh scripts/build-deb.sh "${GITHUB_REF_NAME}"

      - name: RPM package (experimental)
        run: SKIP_WEB=1 sh scripts/build-rpm.sh "${GITHUB_REF_NAME}"

      - uses: actions/upload-artifact@v4
        with:
          name: out-${{ matrix.runner }}
          path: |
            out/*.tar.gz
            out/*.deb
            out/*.rpm
            out/*.sha256

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" out/* --repo "${GITHUB_REPOSITORY}" \
            --title "VirtoMir ${GITHUB_REF_NAME}" --generate-notes \
            $([[ "${GITHUB_REF_NAME}" == *-* ]] && echo --prerelease)

  # Signed apt and rpm repositories on GitHub Pages (ADR-0048), for stable releases. Needs the
  # secret REPO_SIGNING_KEY (an armored private key, gpg --armor --export-secret-keys) and,
  # if that key has one, REPO_SIGNING_PASSPHRASE; without the key this job only says so.
  # Serve the gh-pages branch with GitHub Pages (Settings → Pages) once.
  repos:
    needs: publish
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-24.04
    env:
      SIGNING_KEY: ${{ secrets.REPO_SIGNING_KEY }}
    steps:
      - name: Signing key
        id: key
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "::notice::REPO_SIGNING_KEY is not set: no apt/rpm repository was published."
            echo "ok=false" >>"$GITHUB_OUTPUT"
          else
            echo "ok=true" >>"$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.key.outputs.ok == 'true'
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        if: steps.key.outputs.ok == 'true'
        with:
          path: pkgs
          merge-multiple: true

      - name: Tools and key
        if: steps.key.outputs.ok == 'true'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq apt-utils createrepo-c rpm gnupg
          printf '%s\n' "$SIGNING_KEY" | gpg --batch --import
          echo "GPG_KEY_ID=$(gpg --batch --with-colons --list-secret-keys | awk -F: '/^fpr/ {print $10; exit}')" >>"$GITHUB_ENV"

      - name: Build the repositories
        if: steps.key.outputs.ok == 'true'
        env:
          GPG_PASSPHRASE: ${{ secrets.REPO_SIGNING_PASSPHRASE }}
          REPO_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: |
          if git fetch -q origin gh-pages; then
            git worktree add site origin/gh-pages
          else
            git worktree add --orphan -b gh-pages site
          fi
          sh scripts/build-repos.sh pkgs site

      - name: Publish to gh-pages
        if: steps.key.outputs.ok == 'true'
        run: |
          cd site
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Packages for ${GITHUB_REF_NAME}"
          git push -q origin HEAD:gh-pages
