name: Release

# Push a tag like v0.1.0 to build and publish a release: a tarball and a .deb for amd64 and
# arm64 (each built natively, PAM needs cgo), plus an experimental .rpm for each.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libpam0g-dev rpm

      - name: Test
        run: go test ./...

      - name: Tarball with PAM
        run: sh scripts/build-release.sh "${GITHUB_REF_NAME}"

      - name: Debian package
        run: SKIP_WEB=1 sh scripts/build-deb.sh "${GITHUB_REF_NAME}"

      - name: RPM package (experimental)
        run: SKIP_WEB=1 sh scripts/build-rpm.sh "${GITHUB_REF_NAME}"

      - uses: actions/upload-artifact@v4
        with:
          name: out-${{ matrix.runner }}
          path: |
            out/*.tar.gz
            out/*.deb
            out/*.rpm
            out/*.sha256

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      # Updates install only a package whose .sha256 is signed with the repository key
      # (.sha256.asc, the key of ADR-0048), so a release without signatures is not published.
      - name: Sign the checksums
        env:
          SIGNING_KEY: ${{ secrets.REPO_SIGNING_KEY }}
          GPG_PASSPHRASE: ${{ secrets.REPO_SIGNING_PASSPHRASE }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "::error::REPO_SIGNING_KEY is not set: the checksums cannot be signed, and VirtoMir refuses to update to unsigned releases"
            exit 1
          fi
          export GNUPGHOME=$(mktemp -d)
          key=$(mktemp)
          printf '%s\n' "$SIGNING_KEY" | tr -d '\r' >"$key"
          if ! grep -q -- '-----BEGIN PGP PRIVATE KEY BLOCK-----' "$key"; then
            base64 -d "$key" >"$key.dec" && mv "$key.dec" "$key" # stored base64-encoded
          fi
          gpg --batch --import "$key"
          rm -f "$key"
          id=$(gpg --batch --with-colons --list-secret-keys | awk -F: '/^fpr/ {print $10; exit}')
          for f in out/*.sha256; do
            if [ -n "$GPG_PASSPHRASE" ]; then
              printf %s "$GPG_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --local-user "$id" --armor --detach-sign -o "$f.asc" "$f"
            else
              gpg --batch --yes --local-user "$id" --armor --detach-sign -o "$f.asc" "$f"
            fi
            gpg --batch --verify "$f.asc" "$f"
          done

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" out/* --repo "${GITHUB_REPOSITORY}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" out/* --repo "${GITHUB_REPOSITORY}" \
              --title "VirtoMir ${GITHUB_REF_NAME}" --generate-notes \
              $([[ "${GITHUB_REF_NAME}" == *-* ]] && echo --prerelease)
          fi

  # Signed apt and rpm repositories on GitHub Pages, for stable releases (ADR-0048).
  repos:
    needs: publish
    if: ${{ !contains(github.ref_name, '-') }}
    uses: ./.github/workflows/repos.yml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit
