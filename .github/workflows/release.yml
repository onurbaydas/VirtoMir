name: Release

# Push a tag like v0.1.0 to build and publish a release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libpam0g-dev

      - name: Test
        run: go test ./...

      - name: Build linux/amd64 with PAM
        run: sh scripts/build-release.sh "${GITHUB_REF_NAME}"

      - name: Debian package
        run: SKIP_WEB=1 sh scripts/build-deb.sh "${GITHUB_REF_NAME}"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" out/*.tar.gz out/*.deb out/*.sha256 \
            --title "VirtoMir ${GITHUB_REF_NAME}" --generate-notes \
            $([[ "${GITHUB_REF_NAME}" == *-* ]] && echo --prerelease)
