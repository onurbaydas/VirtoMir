# OpenSSF Scorecard: checks the repository's security practices and publishes the score
# (the badge in the README). https://github.com/ossf/scorecard
name: Scorecard
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0 (v2.6.0 image lost its amd64 manifest on ghcr.io)
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard
          path: results.sarif
          retention-days: 5
      # Code-Review, Maintained and Branch-Protection judge how the repository is run (a single
      # maintainer pushing to main, its age), not the code: they stay in the published score but
      # open no code scanning alerts.
      - name: Leave the process checks out of code scanning
        run: |
          jq '.runs[].results |= map(select(.ruleId as $r | ["CodeReviewID", "MaintainedID", "BranchProtectionID"] | index($r) | not))' \
            results.sarif > filtered.sarif
      - uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          sarif_file: filtered.sarif
