# Copies integrations/terraform-provider-virtomir to github.com/onurbaydas/terraform-provider-virtomir
# with every release and tags it the same, which starts that repository's signed release for the
# Terraform Registry (its .goreleaser.yml and .github/workflows/release.yml come from this folder).
# Needs the secret TF_PROVIDER_DEPLOY_KEY: the private half of a deploy key with write access there.
name: Sync Terraform provider
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (an existing VirtoMir tag, e.g. v1.2.2)"
        required: true
      ref:
        description: "Commit or branch to copy from (default: the tag)"
        required: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      HAS_KEY: ${{ secrets.TF_PROVIDER_DEPLOY_KEY != '' }}
    steps:
      - name: Deploy key set?
        if: env.HAS_KEY != 'true'
        run: echo "::notice::TF_PROVIDER_DEPLOY_KEY is not set; the Terraform provider is not synced."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.HAS_KEY == 'true'
        with:
          ref: ${{ inputs.ref || env.TAG }}
          path: virtomir
          persist-credentials: false
      - name: Push the provider and its tag
        if: env.HAS_KEY == 'true'
        env:
          KEY: ${{ secrets.TF_PROVIDER_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          git clone git@github.com:onurbaydas/terraform-provider-virtomir.git provider
          rsync -a --delete --exclude .git virtomir/integrations/terraform-provider-virtomir/ provider/
          cd provider
          git config user.name "VirtoMir release"
          git config user.email "41346713+onurbaydas@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -q -m "Sync from VirtoMir ${TAG}"
          git branch -M main
          git push -q origin main
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null; then
            echo "::notice::${TAG} is already published there."
          else
            git tag -a "${TAG}" -m "VirtoMir ${TAG}"
            git push -q origin "${TAG}"
          fi
