name: AUR package

# Attaches the AUR files of a stable release to it: PKGBUILD, .SRCINFO (as SRCINFO) and
# virtomir-bin-<version>-aur.tar.gz with both, for the volunteer who maintains virtomir-bin on the AUR.
# Checked in Arch Linux first: the .SRCINFO is regenerated by makepkg and the sources are
# downloaded and verified against the pinned checksums.
# Runs after every stable release (release.yml) and by hand for an existing tag.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v1.2.3"
        required: true
  workflow_call:
    inputs:
      tag:
        type: string
        required: true

permissions:
  contents: read

jobs:
  aur:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: The PKGBUILD names this release
        run: |
          ver=$(sed -n 's/^pkgver=//p' packaging/aur/PKGBUILD)
          if [ "v$ver" != "$TAG" ]; then
            echo "::error::packaging/aur/PKGBUILD on main is $ver, not ${TAG#v}"
            exit 1
          fi

      - name: Check in Arch Linux
        run: |
          docker run --rm -v "$PWD/packaging/aur:/pkg" archlinux:latest bash -euc '
            pacman -Sy --noconfirm --needed base-devel >/dev/null
            useradd -m builder
            cp -r /pkg /home/builder/pkg && chown -R builder /home/builder/pkg
            cd /home/builder/pkg
            su builder -c "makepkg --verifysource --skippgpcheck -f"
            su builder -c "makepkg --printsrcinfo" >/tmp/SRCINFO
            diff -u .SRCINFO /tmp/SRCINFO || { echo "::warning::.SRCINFO regenerated by makepkg"; }
            cp /tmp/SRCINFO /pkg/.SRCINFO
          '

      - name: Attach to the release
        run: |
          ver="${TAG#v}"
          mkdir -p out/virtomir-bin
          cp packaging/aur/PKGBUILD packaging/aur/.SRCINFO out/virtomir-bin/
          cp packaging/aur/PKGBUILD out/PKGBUILD
          cp packaging/aur/.SRCINFO out/SRCINFO
          tar -C out -czf "out/virtomir-bin-${ver}-aur.tar.gz" virtomir-bin
          gh release upload "$TAG" out/PKGBUILD out/SRCINFO "out/virtomir-bin-${ver}-aur.tar.gz" \
            --repo "$GITHUB_REPOSITORY" --clobber
