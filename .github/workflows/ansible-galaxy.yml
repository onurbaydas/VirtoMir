name: Ansible Galaxy

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    name: Build & Publish Collection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'

      - name: Install ansible-core
        run: pip install --require-hashes -r .github/requirements/ansible.txt

      - name: Build collection artifact
        run: |
          mkdir -p dist
          # On a v* tag the collection takes the tag's version (v1.2.3 -> 1.2.3).
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            sed -i "s/^version: .*/version: ${GITHUB_REF_NAME#v}/" integrations/ansible/galaxy.yml
          fi
          ansible-galaxy collection build integrations/ansible --output-path dist/

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ansible-collection
          path: dist/*.tar.gz

      - name: Publish to Ansible Galaxy
        env:
          GALAXY_API_KEY: ${{ secrets.GALAXY_API_KEY }}
        run: |
          if [ -z "${GALAXY_API_KEY}" ]; then
            echo "::error::GALAXY_API_KEY secret is not set. Add it in Repository Settings -> Secrets -> Actions."
            exit 1
          fi
          ansible-galaxy collection publish dist/*.tar.gz --api-key "${GALAXY_API_KEY}"
