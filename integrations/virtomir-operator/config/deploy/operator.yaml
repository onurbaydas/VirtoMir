# VirtoMir operator. First apply config/crd, then create the secret:
#   kubectl -n virtomir-system create secret generic virtomir \
#     --from-literal=url=https://hv1:8420 --from-literal=token=vmt_... [--from-literal=insecure=true]
apiVersion: v1
kind: Namespace
metadata:
  name: virtomir-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: virtomir-operator
  namespace: virtomir-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: virtomir-operator
rules:
  - apiGroups: [virtomir.io]
    resources: [virtomirmachines, virtomirprojects]
    verbs: [get, list, watch, update, patch]
  - apiGroups: [virtomir.io]
    resources: [virtomirmachines/status, virtomirprojects/status]
    verbs: [get, update, patch]
  - apiGroups: [virtomir.io]
    resources: [virtomirmachines/finalizers, virtomirprojects/finalizers]
    verbs: [update]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: virtomir-operator
subjects:
  - kind: ServiceAccount
    name: virtomir-operator
    namespace: virtomir-system
roleRef:
  kind: ClusterRole
  name: virtomir-operator
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: virtomir-operator
  namespace: virtomir-system
spec:
  replicas: 1
  selector:
    matchLabels: {app: virtomir-operator}
  template:
    metadata:
      labels: {app: virtomir-operator}
    spec:
      serviceAccountName: virtomir-operator
      securityContext: {runAsNonRoot: true}
      containers:
        - name: operator
          image: ghcr.io/onurbaydas/virtomir-operator:latest
          args: [--leader-elect]
          env:
            - name: VIRTOMIR_URL
              valueFrom: {secretKeyRef: {name: virtomir, key: url}}
            - name: VIRTOMIR_TOKEN
              valueFrom: {secretKeyRef: {name: virtomir, key: token}}
            - name: VIRTOMIR_INSECURE
              valueFrom: {secretKeyRef: {name: virtomir, key: insecure, optional: true}}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          livenessProbe:
            httpGet: {path: /healthz, port: 8081}
          readinessProbe:
            httpGet: {path: /readyz, port: 8081}
          resources:
            requests: {cpu: 10m, memory: 64Mi}
            limits: {memory: 256Mi}
